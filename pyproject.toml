[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdp-synthetic-population"
version = "1.0.0"
description = "Deterministic synthetic Israeli HDP multi-source population generator"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
hdp-synthetic-population = "synthetic_population.cli:main"
hdp-synthetic-rehydrate = "synthetic_population.rehydrate:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LOINC_short_license.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synthetic_population", "synthetic_population.native_generator"]
namespaces = false

[tool.setuptools.package-data]
synthetic_population = ["data/*.json", "data/specs/*.json"]
"synthetic_population.native_generator" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
